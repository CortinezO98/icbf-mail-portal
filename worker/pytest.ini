[pytest]
# SWEBOK v4 - Software Testing KA: separacion explicita de niveles de prueba
# (unit / integration / system) via markers, para poder correrlos por
# separado en CI (ej. unit en cada push, integration solo antes de deploy).
markers =
    unit: pruebas unitarias, sin I/O real (DB, red, filesystem) - deben ser rapidas y deterministicas
    integration: pruebas que ejercitan mas de un componente junto (pendiente: requiere DB de pruebas)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

# Salida detallada + resumen corto de fallos, util en CI
addopts = -v --strict-markers --tb=short
